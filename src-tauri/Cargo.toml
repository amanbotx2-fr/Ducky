[package]
name = "ducky"
version = "1.1.0"
description = "Ducky desktop AI companion."
authors = ["Aman"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ducky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
image = { version = "=0.25.5", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon"] }
tempfile = "3"
url = "2"
