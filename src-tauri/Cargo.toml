[package]
name = "ducky"
version = "1.1.0"
description = "Ducky desktop AI companion."
authors = ["Aman"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ducky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "=0.25.5", default-features = false, features = ["png"] }
iana-time-zone = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
url = "2"
uuid = { version = "1.24.0", features = ["v4"] }
zeroize = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
